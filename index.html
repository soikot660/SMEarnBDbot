<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMEarnBDbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #172554);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
      backdrop-filter: blur(10px);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #22c55e;
      font-size: 25px;
      font-weight: bold;
    }
    h1 { margin: 8px 0; font-size: 30px; }
    p { color: #dbeafe; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #22c55e;
      color: #062e16;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { opacity: .9; }
    .note { font-size: 13px; margin-top: 18px; color: #bfdbfe; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SM</div>
    <h1>SMEarnBDbot</h1>
    <p>স্বাগতম! আমাদের Telegram bot-এর মাধ্যমে বিভিন্ন earning feature ব্যবহার করতে পারবেন।</p>
    <a class="btn" href="https://t.me/SMEarnBDbot" target="_blank">Telegram Bot খুলুন</a>
    <div class="note">© 2026 SMEarnBDbot</div>
  </div>
</body>
</html>
